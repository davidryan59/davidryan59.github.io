<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Random Odd-Cyclic Polyhedra · David Ryan</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #eef5ff;
      --muted: #91a4bd;
      --line: rgba(190, 214, 242, .14);
      --deep: #050b14;
      --teal: #71e1d6;
      background: var(--deep);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      color: var(--ink);
      background: var(--deep);
    }
    button { color: inherit; font: inherit; }
    button:focus-visible, canvas:focus-visible { outline: 2px solid var(--teal); outline-offset: -3px; }
    sub { font-size: .62em; line-height: 0; vertical-align: -.14em; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 1rem; font-weight: 650; }
    header p { margin: 2px 0 0; font-size: .78rem; color: var(--muted); }
    .btn {
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(113, 225, 214, .12);
      cursor: pointer;
    }
    .btn:hover { background: rgba(113, 225, 214, .22); }

    .grid {
      container-type: size;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      min-height: 0;
    }
    @media (max-width: 640px) and (orientation: portrait) {
      .grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(4, minmax(0, 1fr)); }
    }
    .cell { position: relative; min-width: 0; min-height: 0; background: var(--deep); }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .label { position: absolute; left: 12px; top: 8px; pointer-events: none; }
    .label h2 { margin: 0; font-size: 1.05rem; font-weight: 650; }
    .label p { margin: 2px 0 0; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cell .btn { position: absolute; right: 10px; bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Random odd-cyclic polyhedra</h1>
      <p>m points, n-fold rotation, plus the inversion · drag a solid to turn it</p>
    </div>
    <button class="btn" id="all" type="button">Randomise all</button>
  </header>
  <main class="grid" id="grid" aria-label="Four random polyhedra"></main>

  <script src="models.js"></script>
  <script src="shadow.js"></script>
  <script>
  (function start() {
    "use strict";

    const { convexHullFacets, cross, dot, subtract, verticesFromOrbit } = window.NonRupertModels;
    const { apply, axisRotation, multiply } = window.NonRupertShadow;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // n is the rotation order and m the number of generator points. The solid has 2mn points.
    const CASES = [
      { n: 3, m: 6, hue: 286 },
      { n: 5, m: 5, hue: 212 },
      { n: 5, m: 6, hue: 160 },
      { n: 7, m: 5, hue: 38 }
    ];
    // The same shape bounds as attacks/non-rupert/search.py: the first point has radius 1
    // and phase 0, the rest have radius 0.86 to 1 and any phase.
    const RADIUS_LOW = 0.86;
    const CAMERA = 6;
    const LIGHT = normalise([-0.5, 0.8, 0.65]);
    // The end faces are a little darker than the triangles.
    const END_DARKEN = 0.78;

    function normalise(v) {
      const size = Math.hypot(v[0], v[1], v[2]) || 1;
      return v.map(value => value / size);
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // A generator in the upper hemisphere: cos(beta) uniform in [0, 1].
    function generator(random, first, n) {
      const beta = Math.acos(random());
      const radius = first ? 1 : RADIUS_LOW + (1 - RADIUS_LOW) * random();
      const phase = first ? 0 : random() * 2 * Math.PI / n;
      return [
        radius * Math.sin(beta) * Math.cos(phase),
        radius * Math.sin(beta) * Math.sin(phase),
        radius * Math.cos(beta)
      ];
    }

    function build(spec, seed) {
      const random = mulberry32(seed);
      const generators = Array.from({ length: spec.m }, (_, i) => generator(random, i === 0, spec.n));
      const vertices = verticesFromOrbit({ generators, order: spec.n });
      const facets = convexHullFacets(vertices);
      const used = new Set(facets.flat());
      // The end faces are the n-gons at the two ends of the rotation axis.
      const ends = facets.map(facet => facet.length === spec.n &&
        facet.every(index => Math.abs(vertices[index][2] - vertices[facet[0]][2]) < 1e-9));
      return { vertices, facets, ends, hullCount: used.size };
    }

    function newSeed() {
      return Math.floor(Math.random() * 90000) + 10000;
    }

    const grid = document.querySelector("#grid");
    const panels = CASES.map(spec => {
      const cell = document.createElement("section");
      cell.className = "cell";
      cell.innerHTML = `<canvas tabindex="0" aria-label="C${spec.n} with ${spec.m} points. Drag to turn it."></canvas>
        <div class="label"><h2>C<sub>${spec.n}</sub> · ${spec.m} points</h2><p></p></div>
        <button class="btn" type="button">Randomise</button>`;
      grid.append(cell);
      const panel = {
        spec,
        canvas: cell.querySelector("canvas"),
        note: cell.querySelector("p"),
        button: cell.querySelector("button"),
        rotation: multiply(axisRotation([1, 0, 0], -0.5), axisRotation([0, 1, 0], 0.4)),
        spinning: !reducedMotion,
        solid: null
      };
      panel.button.addEventListener("click", () => randomise(panel));
      attachDrag(panel);
      return panel;
    });

    function randomise(panel) {
      const seed = newSeed();
      panel.solid = build(panel.spec, seed);
      const total = panel.solid.vertices.length;
      panel.note.textContent = `seed ${seed} · ${panel.solid.hullCount} of ${total} points are vertices · ${panel.solid.facets.length} faces`;
    }

    function attachDrag(panel) {
      let last = null;
      panel.canvas.addEventListener("pointerdown", event => {
        panel.canvas.setPointerCapture(event.pointerId);
        last = { x: event.clientX, y: event.clientY };
        panel.spinning = false;
      });
      panel.canvas.addEventListener("pointermove", event => {
        if (!last) return;
        turn(panel, event.clientX - last.x, event.clientY - last.y);
        last = { x: event.clientX, y: event.clientY };
      });
      const end = () => { last = null; };
      panel.canvas.addEventListener("pointerup", end);
      panel.canvas.addEventListener("pointercancel", end);
      panel.canvas.addEventListener("keydown", event => {
        const step = 0.12;
        const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
        if (!moves[event.key]) return;
        event.preventDefault();
        panel.spinning = false;
        turn(panel, moves[event.key][0] * step / 0.01, moves[event.key][1] * step / 0.01);
      });
    }

    // Turn about the screen's own axes, so the solid follows the pointer.
    function turn(panel, dx, dy) {
      const step = multiply(axisRotation([1, 0, 0], dy * 0.01), axisRotation([0, 1, 0], dx * 0.01));
      panel.rotation = multiply(step, panel.rotation);
    }

    function resize(canvas) {
      const rect = canvas.getBoundingClientRect();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.round(rect.width * ratio));
      const height = Math.max(1, Math.round(rect.height * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      return ratio;
    }

    function draw(panel) {
      const ratio = resize(panel.canvas);
      const context = panel.canvas.getContext("2d");
      const { width, height } = panel.canvas;
      context.clearRect(0, 0, width, height);
      context.lineJoin = "round";
      if (!panel.solid) return;

      // Leave room for the label above and the button below.
      const centreX = width / 2;
      const centreY = height / 2 + 6 * ratio;
      const scale = 0.42 * Math.min(width, height - 40 * ratio);
      const world = panel.solid.vertices.map(point => apply(panel.rotation, point));
      const screen = p => {
        const f = CAMERA / (CAMERA - p[2]);
        return [centreX + p[0] * f * scale, centreY - p[1] * f * scale];
      };
      const camera = [0, 0, CAMERA];
      const hue = panel.spec.hue;
      context.lineWidth = Math.max(0.65 * ratio, 1);
      context.strokeStyle = `hsl(${hue} 90% 88% / .28)`;
      panel.solid.facets.forEach((facet, number) => {
        const points = facet.map(index => world[index]);
        const normal = normalise(cross(subtract(points[1], points[0]), subtract(points[2], points[0])));
        if (dot(normal, subtract(camera, points[0])) <= 0) return;
        const shade = 26 + Math.max(0, dot(normal, LIGHT)) * 34 + (normal[0] + 1) * 2.5;
        const lightness = panel.solid.ends[number] ? shade * END_DARKEN : shade;
        context.beginPath();
        points.forEach((p, i) => {
          const [x, y] = screen(p);
          if (i) context.lineTo(x, y); else context.moveTo(x, y);
        });
        context.closePath();
        context.fillStyle = `hsl(${hue + normal[1] * 12} 55% ${lightness}%)`;
        context.fill();
        context.stroke();
      });
    }

    function frame() {
      for (const panel of panels) {
        if (panel.spinning) turn(panel, 0.5, 0);
        draw(panel);
      }
      requestAnimationFrame(frame);
    }

    document.querySelector("#all").addEventListener("click", () => panels.forEach(randomise));
    panels.forEach(randomise);
    frame();
  }());
  </script>
</body>
</html>
