<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Interactive 3D views of the C13 and C11 numerical non-Rupert candidates.">
  <title>Non-Rupert candidates · David Ryan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">Numerical search</p>
      <h1>Non-Rupert candidates</h1>
    </div>
    <p class="instructions">Drag to turn · scroll or pinch to zoom</p>
    <button class="icon-button" id="fullscreen" type="button" aria-label="Enter full screen" title="Full screen">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
      </svg>
    </button>
  </header>

  <main class="comparison" aria-label="Interactive comparison of two polyhedra">
    <article class="model-card model-card--c13">
      <canvas data-model="c13" tabindex="0" aria-label="Interactive 3D view of the C13 candidate"></canvas>
      <div class="model-copy">
        <p class="status">Certification candidate</p>
        <h2>C<sub>13</sub></h2>
        <p>78 vertices · 132 faces</p>
      </div>
      <div class="model-controls">
        <button class="model-button spin-button" type="button" aria-pressed="true" aria-label="Pause C13 rotation">
          <span class="pause-icon" aria-hidden="true"></span>
          <span class="control-label">Pause</span>
        </button>
        <button class="model-button reset-button" type="button" aria-label="Reset C13 view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          <span class="control-label">Reset</span>
        </button>
      </div>
    </article>

    <article class="model-card model-card--c11">
      <canvas data-model="c11" tabindex="0" aria-label="Interactive 3D view of the C11 candidate"></canvas>
      <div class="model-copy">
        <p class="status">Weaker numerical lead</p>
        <h2>C<sub>11</sub></h2>
        <p>66 vertices · 112 faces</p>
      </div>
      <div class="model-controls">
        <button class="model-button spin-button" type="button" aria-pressed="true" aria-label="Pause C11 rotation">
          <span class="pause-icon" aria-hidden="true"></span>
          <span class="control-label">Pause</span>
        </button>
        <button class="model-button reset-button" type="button" aria-label="Reset C11 view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          <span class="control-label">Reset</span>
        </button>
      </div>
    </article>
  </main>

  <footer>
    These are search results, not proofs. The C<sub>13</sub> candidate has passed the stronger numerical audit.
  </footer>

  <script src="models.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
