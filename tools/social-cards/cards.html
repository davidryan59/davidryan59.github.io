<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social cards</title>
<!-- One social card at 1200 x 630, chosen by ?card=<id>. render.js opens
     this page for each card and saves a screenshot to social/<id>.jpg.
     Pictures that stage 1 of render.js draws are served under /__cards/.
     Every card keeps its words and its main picture inside the centre
     630 x 630 square, so a square thumbnail crop still reads. -->
<style>
  html, body { margin: 0; background: #111; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Georgia, "Times New Roman", serif; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #f6f3ec; }
  .fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 570px; box-sizing: border-box; padding: 30px 40px 28px; text-align: center;
    background: rgba(253, 251, 246, 0.95); border-radius: 22px; box-shadow: 0 6px 28px rgba(30, 25, 10, 0.28);
  }
  h1 { font-size: 56px; font-weight: normal; line-height: 1.08; color: #1a1a1a; margin: 0; white-space: nowrap; }
  p { font-size: 25px; line-height: 1.3; color: #55524a; margin: 12px 0 0; text-wrap: balance; }
  .site { font-size: 21px; color: #1552a1; margin-top: 16px; letter-spacing: 0.02em; }

  /* Mint pages: three artworks on a dark ground, the middle one largest. */
  .dark { background: radial-gradient(circle at 50% 35%, #2c2a3a, #111016 75%); }
  .art-row { position: absolute; top: 40px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 34px; }
  .art-row img { width: 290px; height: 290px; }
  .art-row img.mid { width: 350px; height: 350px; }
  .art-text { position: absolute; left: 0; right: 0; bottom: 36px; text-align: center; }
  .art-text h1 { color: #f5f3ec; font-size: 54px; }
  .art-text p { color: #c8c4b9; }
  .art-text .site { color: #7aa6e0; }

  /* Audits: the contract's own bytecode as a ground, a diagram above the words. */
  .hex {
    position: absolute; inset: -6px; margin: 0; font: 13px/16px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: rgba(70, 62, 40, 0.16); white-space: pre-wrap; word-break: break-all; overflow: hidden;
  }
  .audit .panel { width: 600px; padding: 20px 36px 24px; }
  .audit svg { display: block; margin: 0 auto 6px; }
  .audit h1 { font-size: 48px; }
  .audit p { font-size: 23px; margin-top: 8px; }
  .audit .site { margin-top: 12px; }

  /* Builder page: a mosaic of the work, with the name in the middle. */
  .mosaic { background: #1b1a20; }
  .grid { position: absolute; inset: 0; display: grid; gap: 6px; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }
  .tile { position: relative; overflow: hidden; background: #17161c; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.art img { object-fit: contain; box-sizing: border-box; padding: 14px; }
  .tile.cream { background: #f6f3ec; display: grid; place-items: center; }
  .name { grid-column: 2 / 4; background: #fdfbf6; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .name h1 { font-size: 54px; }
  .name p { font-size: 24px; margin-top: 8px; }
  .name .site { font-size: 21px; margin-top: 10px; }

  /* Parfly: the app's road and pin, drawn across a green ground. */
  .parfly { background: linear-gradient(180deg, #f3f8ef 0%, #cfe6c2 55%, #93c77f 100%); }
  .parfly .panel { display: flex; align-items: center; gap: 26px; text-align: left; width: 640px; padding: 26px 34px; background: #fdfbf6; }
  .parfly .panel > div { min-width: 0; }
  .parfly .panel img { width: 128px; height: 128px; border-radius: 28px; flex: none; }
  .parfly h1 { font-size: 46px; }
  .parfly p { font-size: 23px; }
</style>
</head>
<body>
<div id="out"></div>
<script>
(function () {
  'use strict';
  var SRC = '/__cards/';
  var id = new URLSearchParams(location.search).get('card');

  function words(title, sub, site) {
    return '<h1>' + title + '</h1><p>' + sub + '</p><div class="site">' + (site || 'drbuild.uk') + '</div>';
  }
  function tiling(src, title, sub) {
    return '<div class="card"><img class="fill" src="' + SRC + src + '.png" alt="">' +
      '<div class="panel">' + words(title, sub, 'Aperiodic Tiling Explorer · drbuild.uk') + '</div></div>';
  }
  function art(files, title, sub) {
    return '<div class="card dark"><div class="art-row">' + files.map(function (f, i) {
      return '<img src="' + f + '"' + (i === 1 ? ' class="mid"' : '') + ' alt="">';
    }).join('') + '</div><div class="art-text">' + words(title, sub, 'Mint at drbuild.uk') + '</div></div>';
  }

  /* ------------------------------------------------------------ diagrams */

  var INK = '#3d3c63', LINE = '#1552a1', SOFT = '#e4e0f5';
  function arrow(d, id) {
    return '<path d="' + d + '" fill="none" stroke="' + LINE + '" stroke-width="4" marker-end="url(#' + id + ')"/>';
  }
  function head(id) {
    return '<marker id="' + id + '" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">' +
      '<path d="M0 0 10 5 0 10z" fill="' + LINE + '"/></marker>';
  }
  var diagrams = {
    // ETH in, WETH out, one for one, and back again.
    weth9: function () {
      return '<svg width="520" height="220" viewBox="0 0 520 220" font-family="Georgia, serif"><defs>' + head('a1') + '</defs>' +
        '<circle cx="105" cy="110" r="72" fill="' + SOFT + '" stroke="#5b5a8a" stroke-width="4"/>' +
        '<text x="105" y="124" text-anchor="middle" font-size="40" fill="' + INK + '">ETH</text>' +
        '<rect x="318" y="20" width="180" height="180" rx="34" fill="#eef3fb" stroke="' + LINE + '" stroke-width="4" stroke-dasharray="11 8"/>' +
        '<circle cx="408" cy="110" r="62" fill="' + SOFT + '" stroke="#5b5a8a" stroke-width="4"/>' +
        '<text x="408" y="122" text-anchor="middle" font-size="31" fill="' + INK + '">WETH</text>' +
        arrow('M 190 72 C 230 38, 270 36, 304 60', 'a1') + arrow('M 304 160 C 270 184, 230 182, 190 148', 'a1') +
        '<text x="248" y="30" text-anchor="middle" font-size="21" fill="' + LINE + '">deposit</text>' +
        '<text x="248" y="208" text-anchor="middle" font-size="21" fill="' + LINE + '">withdraw</text>' +
        '<text x="248" y="120" text-anchor="middle" font-size="30" fill="' + INK + '">1 : 1</text></svg>';
    },
    // The constant product curve, with one trade along it.
    'uniswap-v2': function () {
      var X0 = 70, Y0 = 195, W = 420, H = 175, k = 0.09;
      function px(x) { return X0 + x * W; }
      function py(y) { return Y0 - y * H; }
      var pts = [];
      for (var x = 0.1; x <= 1.0001; x += 0.01) pts.push(px(x).toFixed(1) + ' ' + py(k / x).toFixed(1));
      var ax = 0.22, bx = 0.42, ay = k / ax, by = k / bx;
      return '<svg width="520" height="220" viewBox="0 0 520 220" font-family="Georgia, serif">' +
        '<path d="M ' + X0 + ' 12 V ' + Y0 + ' H 505" fill="none" stroke="#8a8578" stroke-width="2.5"/>' +
        '<path d="M ' + pts.join(' L ') + '" fill="none" stroke="' + LINE + '" stroke-width="5" stroke-linecap="round"/>' +
        '<path d="M ' + px(ax) + ' ' + py(ay) + ' H ' + px(bx) + ' V ' + py(by) + '" fill="none" stroke="#c0263b" stroke-width="3" stroke-dasharray="8 6"/>' +
        '<circle cx="' + px(ax) + '" cy="' + py(ay) + '" r="8" fill="#c0263b"/><circle cx="' + px(bx) + '" cy="' + py(by) + '" r="8" fill="#c0263b"/>' +
        '<text x="' + (px(ax) + px(bx)) / 2 + '" y="' + (py(ay) - 10) + '" text-anchor="middle" font-size="22" fill="#c0263b">Δx</text>' +
        '<text x="' + (px(bx) + 10) + '" y="' + (py(ay) + py(by)) / 2 + '" font-size="22" fill="#c0263b">Δy</text>' +
        '<text x="330" y="70" font-size="34" fill="' + INK + '">x · y = k</text>' +
        '<text x="500" y="215" text-anchor="end" font-size="18" fill="#8a8578">reserve x</text>' +
        '<text x="' + (X0 - 10) + '" y="22" text-anchor="end" font-size="18" fill="#8a8578">y</text></svg>';
    },
    // A year of the price, held in a narrow band around one dollar.
    dai: function () {
      var X0 = 90, X1 = 500, Yc = 112, pts = [];
      for (var i = 0; i <= 200; i++) {
        var t = i / 200, wob = Math.sin(t * 47) * 0.5 + Math.sin(t * 131 + 1.3) * 0.3 + Math.sin(t * 17 + 0.4) * 0.35;
        pts.push((X0 + t * (X1 - X0)).toFixed(1) + ' ' + (Yc - wob * 9).toFixed(1));
      }
      return '<svg width="520" height="195" viewBox="0 0 520 195" font-family="Georgia, serif">' +
        '<rect x="' + X0 + '" y="' + (Yc - 26) + '" width="' + (X1 - X0) + '" height="52" fill="#eef3fb"/>' +
        '<path d="M ' + X0 + ' ' + Yc + ' H ' + X1 + '" stroke="#8a8578" stroke-width="2.5" stroke-dasharray="9 7"/>' +
        '<path d="M ' + pts.join(' L ') + '" fill="none" stroke="' + LINE + '" stroke-width="4" stroke-linejoin="round"/>' +
        '<text x="' + (X0 - 12) + '" y="' + (Yc + 7) + '" text-anchor="end" font-size="22" fill="' + INK + '">$1.00</text>' +
        '<text x="' + X0 + '" y="48" font-size="34" fill="' + INK + '">1 DAI ≈ $1</text>' +
        '<path d="M ' + X0 + ' 162 H ' + X1 + '" stroke="#8a8578" stroke-width="2.5"/>' +
        '<text x="' + X1 + '" y="186" text-anchor="end" font-size="18" fill="#8a8578">time</text></svg>';
    }
  };
  function audit(key, title, sub) {
    return fetch(SRC + key + '.txt').then(function (r) { return r.text(); }).then(function (hex) {
      var text = hex.replace(/^0x/, '');
      while (text.length < 14000) text += text;
      return '<div class="card audit"><pre class="hex">' + text + '</pre><div class="panel">' + diagrams[key]() +
        words(title, sub) + '</div></div>';
    });
  }

  // A winding road with a dashed centre line, as on the Parfly icon.
  function parfly() {
    var road = 'M -60 470 C 160 420, 240 250, 430 250 S 700 430, 880 380 S 1080 140, 1280 120';
    return '<div class="card parfly"><svg class="fill" viewBox="0 0 1200 630">' +
      '<path d="' + road + '" fill="none" stroke="#222a33" stroke-width="64" stroke-linecap="round"/>' +
      '<path d="' + road + '" fill="none" stroke="#f2c230" stroke-width="7" stroke-dasharray="34 26"/></svg>' +
      '<div class="panel"><img src="parfly-icon.png" alt=""><div>' +
      words('Parfly privacy policy', 'No account, no ads, no analytics. Your rides stay on your phone.') + '</div></div></div>';
  }

  function builder() {
    function img(src, pos) { return '<div class="tile"><img src="' + src + '" style="object-position: ' + (pos || '50% 50%') + '" alt=""></div>'; }
    function artTile(f) { return '<div class="tile art"><img src="' + f + '" alt=""></div>'; }
    var curve = '<div class="tile cream">' + diagrams['uniswap-v2']().replace('width="520" height="220"', 'width="286" height="121"') + '</div>';
    return '<div class="card mosaic"><div class="grid">' +
      artTile(SRC + 'merge-fractal-1509.png') + img(SRC + 'hat.png', '40% 45%') + artTile('/moving-mondrian/moving-mondrian-951.svg') + img(SRC + 'dino-dash.png') +
      img(SRC + 'retuner.png') + '<div class="name">' + words('David Ryan', 'Everything I’ve built, in one place') + '</div>' + curve +
      img(SRC + 'hat-curves.png', '55% 50%') + artTile(SRC + 'merge-fractal-2757.png') + img(SRC + 'spectre.png', '35% 50%') + artTile('/moving-mondrian/moving-mondrian-563.svg') +
      '</div></div>';
  }

  var CARDS = {
    builder: builder,
    hat: function () { return tiling('hat', 'Hat tiling', 'The original aperiodic tile, which uses its mirror image'); },
    spectre: function () { return tiling('spectre', 'Spectre tiling', 'Tiles using only rotations, mirror image not required'); },
    'hat-extended': function () { return tiling('hat-extended', 'Hat tiling (extended)', 'Edge options on Hat make mirror image a separate tile'); },
    'merge-fractals': function () {
      return art([SRC + 'merge-fractal-1509.png', SRC + 'merge-fractal-1904.png', SRC + 'merge-fractal-2757.png'],
        'Ethereum Merge Fractals', 'Generative onchain art marking Ethereum’s Merge');
    },
    // Token 12, kept beside this page, stands in for token 133, which is a
    // portrait, so no card shows a face.
    'moving-mondrian': function () {
      return art(['moving-mondrian-12.svg', '/moving-mondrian/moving-mondrian-563.svg', '/moving-mondrian/moving-mondrian-951.svg'], 'Moving Mondrian', 'Fully onchain generative art on Optimism');
    },
    weth9: function () { return audit('weth9', 'WETH9 security audit', 'No exploitable vulnerability, read from the deployed bytecode'); },
    'uniswap-v2': function () { return audit('uniswap-v2', 'Uniswap V2 security audit', 'No exploitable vulnerability across 519,134 pairs'); },
    dai: function () { return audit('dai', 'DAI security audit', 'No exploitable vulnerability, and the mint authority closed since 2019'); },
    parfly: parfly
  };

  // A title stays on one line: a long one shrinks until it fits its box.
  function fitTitles() {
    Array.prototype.forEach.call(document.querySelectorAll('h1'), function (h) {
      var size = parseFloat(getComputedStyle(h).fontSize);
      while (h.scrollWidth > h.clientWidth && size > 34) { size -= 1; h.style.fontSize = size + 'px'; }
    });
  }

  // Once the card and its pictures have loaded, render.js takes the shot.
  Promise.resolve(CARDS[id]()).then(function (html) {
    document.getElementById('out').innerHTML = html;
    var imgs = Array.prototype.slice.call(document.images);
    return Promise.all(imgs.map(function (im) {
      return im.complete ? null : new Promise(function (res) { im.onload = im.onerror = res; });
    })).then(function () { return document.fonts.ready; });
  }).then(function () {
    fitTitles();
    // render.js refuses a card with a picture that failed to load.
    document.body.dataset.broken = Array.prototype.filter.call(document.images, function (im) { return !im.naturalWidth; })
      .map(function (im) { return im.src; }).join(' ');
    document.body.dataset.ready = '1';
  });
})();
</script>
</body>
</html>
