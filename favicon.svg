<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <style>
    .tri { fill: #f5f3ec; stroke: #1a1a1a; stroke-width: 0.5; stroke-linejoin: round; }

    /* Depth follows the rendered size. Each of the 9 second-level triangles
       needs real pixels to keep its border crisp - under 48px they blur into
       grey mush, so the tab and bookmark bar get 3 clean triangles and only
       larger renders get the full 9-triangle Sierpinski pattern. If a
       browser ignores this query it keeps level 1, the safe failure. */
    .deep { display: none; }
    @media (min-width: 48px) {
      .flat { display: none; }
      .deep { display: block; }
    }
  </style>

  <!-- Coordinates sit on the 16px grid: apex 8,1 and base 1,15 to 15,15. -->
  <g class="flat">
    <path class="tri" d="M8 1 4.5 8 11.5 8Z"/>
    <path class="tri" d="M1 15 4.5 8 8 15Z"/>
    <path class="tri" d="M15 15 11.5 8 8 15Z"/>
  </g>

  <g class="deep">
    <path class="tri" d="M8 1 6.25 4.5 9.75 4.5Z"/>
    <path class="tri" d="M4.5 8 6.25 4.5 8 8Z"/>
    <path class="tri" d="M11.5 8 9.75 4.5 8 8Z"/>

    <path class="tri" d="M1 15 2.75 11.5 4.5 15Z"/>
    <path class="tri" d="M4.5 8 2.75 11.5 6.25 11.5Z"/>
    <path class="tri" d="M8 15 4.5 15 6.25 11.5Z"/>

    <path class="tri" d="M15 15 13.25 11.5 11.5 15Z"/>
    <path class="tri" d="M11.5 8 13.25 11.5 9.75 11.5Z"/>
    <path class="tri" d="M8 15 11.5 15 9.75 11.5Z"/>
  </g>
</svg>
